<!DOCTYPE html>

<html lang="en">

<head>


<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Login - Computer Science</title>

<link rel="stylesheet" href="style.css">


</head>

<body>


<!-- Navigation -->

<header>

    <nav class="navbar">

        <div class="logo">
            Computer Science
        </div>

        <ul class="nav-links">

            <li>
                <a href="index.html">Home</a>
            </li>

            <li>
                <a href="login.html">Login</a>
            </li>

            <li>
                <a href="register.html">Registration</a>
            </li>

            <li>
                <a href="about.html">About Us</a>
            </li>

        </ul>

    </nav>

</header>


<!-- Login Section -->

<section class="login-section">

    <div class="login-box">

        <h1>Welcome Back</h1>

        <p class="subtitle">
            Department of Computer Science
        </p>

        <p class="subtitle">
            Pondicherry University
        </p>


        <form action="login.php" method="POST">


            <!-- Username -->

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    required
                >

            </div>


            <!-- Password -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <!-- Login Button -->

            <button
                type="submit"
                class="login-btn"
            >
                Login
            </button>


            <!-- Registration Link -->

            <p class="register-text">

                Don't have an account?

                <a href="register.html">
                    Register here
                </a>

            </p>

        </form>

    </div>

</section>


<script src="script.js"></script>


</body>

</html>
